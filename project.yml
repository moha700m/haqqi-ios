name: Haqqi
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Haqqi:
    type: application
    platform: iOS
    sources:
      - path: Haqqi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.haqqi
        PRODUCT_NAME: Haqqi
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Haqqi/Info.plist
    info:
      path: Haqqi/Info.plist
      properties:
        CFBundleDisplayName: "حقّي"
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: false
        UILaunchStoryboardName: LaunchScreen
        UIDeviceFamily: [1]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
        NSCameraUsageDescription: "نحتاج الكاميرا عشان تصوّر الفاتورة والمنتج كدليل. الصور تبقى على جهازك."
        NSPhotoLibraryUsageDescription: "نحتاج الصور عشان تختار صورة الفاتورة أو المنتج كدليل. الصور تبقى على جهازك."
        NSFaceIDUsageDescription: "نستخدم Face ID عشان نقفل قضاياك ونحمي بياناتك."
        ITSAppUsesNonExemptEncryption: false
  HaqqiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HaqqiTests
      - path: Haqqi/Core
      - path: Haqqi/Resources/rules.json
      - path: Haqqi/Resources/cards.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.haqqi.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Haqqi:
    build:
      targets:
        Haqqi: all
        HaqqiTests: [test]
    test:
      targets:
        - HaqqiTests
