name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          best=None
          for rt,devs in d.items():
            if 'iOS' not in rt: continue
            for x in devs:
              if x['name']=='iPhone 16 Pro': best=x['udid']
          if not best:
            for rt,devs in d.items():
              if 'iOS' not in rt: continue
              for x in devs:
                if x['name'].startswith('iPhone') and 'Pro' in x['name']: best=x['udid']
          print(best or '')
          ")
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          xcrun simctl list devices | grep "$UDID"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project Haqqi.xcodeproj -scheme Haqqi \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "error:|Test Case|Executed|TEST" || true
          test ${PIPESTATUS[0]} -eq 0
      - name: Simulator screenshots
        run: |
          set -x
          UDID=${{ steps.sim.outputs.udid }}
          xcodebuild build -project Haqqi.xcodeproj -scheme Haqqi -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO -quiet
          APP=$(find build/sim/Build/Products -name "Haqqi.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { # name, args...
            local name=$1; shift
            xcrun simctl terminate "$UDID" com.moha700m.haqqi || true
            xcrun simctl launch "$UDID" com.moha700m.haqqi "$@"
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot onboarding
          shot home -onboarded YES -seedDemo YES
          shot chat -onboarded YES -screen chat -demoChat YES
          shot sources -onboarded YES -screen sources
          shot calculator -onboarded YES -screen calculator
          shot verdict -onboarded YES -screen verdict
          shot cases -onboarded YES -screen cases
          shot learn -onboarded YES -screen learn
          shot settings -onboarded YES -screen settings
          xcrun simctl ui "$UDID" appearance dark
          shot home-dark -onboarded YES
          shot chat-dark -onboarded YES -screen chat
          shot verdict-dark -onboarded YES -screen verdict
          xcrun simctl ui "$UDID" appearance light
          sips -g pixelWidth -g pixelHeight shots/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            shots/
            test.log
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild archive -project Haqqi.xcodeproj -scheme Haqqi -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Haqqi.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -30
          mkdir -p Payload
          cp -R build/Haqqi.xcarchive/Products/Applications/Haqqi.app Payload/
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Payload/Haqqi.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :DTSDKName" Payload/Haqqi.app/Info.plist
          P=Payload/Haqqi.app/Info.plist
          plutil -p "$P"
          plutil -extract UILaunchScreen raw "$P" >/dev/null 2>&1 || plutil -extract UILaunchScreen xml1 -o - "$P" || { echo "::error::UILaunchScreen missing"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' $P)" = "LaunchScreen" || { echo "::error::UILaunchStoryboardName missing"; exit 1; }
          test -d Payload/Haqqi.app/LaunchScreen.storyboardc || { echo "::error::LaunchScreen.storyboardc missing"; exit 1; }
          FAM=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' $P | tr -d ' \n')
          echo "UIDeviceFamily=$FAM"; [ "$FAM" = "Array{1}" ] || { echo "::error::UIDeviceFamily not [1]"; exit 1; }
          ls Payload/Haqqi.app/LaunchScreen.storyboardc
          zip -qry Haqqi.ipa Payload
          ls -la Haqqi.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Haqqi-ipa
          path: Haqqi.ipa
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Haqqi.ipa --title "Haqqi $TAG (unsigned)" --notes "Unsigned IPA for ESign. Commit ${{ github.sha }}"
